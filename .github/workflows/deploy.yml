name: Deploy to GitHub Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: bun install || npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build SPA (relative base + 404.html + .nojekyll)
        run: npm run build
        env:
          VITE_BASE_PATH: "./"
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FIRESTORE_DATABASE_ID: ${{ vars.VITE_FIRESTORE_DATABASE_ID }}

      - name: Deploy dist to gh-pages branch & auto-enable GitHub Pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          FULL_REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.ref_name }}
        run: |
          set -e
          OWNER_LOWER=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          LIVE_URL="https://${OWNER_LOWER}.github.io/${REPO}/"
          echo "LIVE_URL=$LIVE_URL" >> $GITHUB_ENV

          # 1) Push built files in ./dist to the gh-pages branch
          cd dist
          touch .nojekyll
          cp -f index.html 404.html
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b gh-pages
          git add -A
          git commit -m "Deploy kAM web app to GitHub Pages"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${FULL_REPO}.git" gh-pages
          cd ..

          # 2) Auto-enable GitHub Pages on the gh-pages branch via REST API (if not already enabled)
          gh api --method POST "repos/${FULL_REPO}/pages" \
            -f "source[branch]=gh-pages" \
            -f "source[path]=/" 2>/dev/null || \
          gh api --method PUT "repos/${FULL_REPO}/pages" \
            -f "build_type=legacy" \
            -f "source[branch]=gh-pages" \
            -f "source[path]=/" 2>/dev/null || true

          # 3) Stamp the real live URL in the repository Website & Description (top of repo)
          gh api --method PATCH "repos/${FULL_REPO}" \
            -f homepage="$LIVE_URL" \
            -f description="نجم الكارت (kAM) — رابط تشغيل التطبيق: $LIVE_URL" 2>/dev/null || true

          # 4) Replace any placeholder URL in README.md on the main branch with the real LIVE_URL
          if grep -q "__GITHUB_PAGES_LIVE_URL__" README.md; then
            sed -i "s|__GITHUB_PAGES_LIVE_URL__|${LIVE_URL}|g" README.md
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "docs: update README with real GitHub Pages URL [skip ci]" || true
            git push "https://x-access-token:${GH_TOKEN}@github.com/${FULL_REPO}.git" "HEAD:${DEFAULT_BRANCH}" || true
          fi
