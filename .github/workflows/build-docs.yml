name: Build /docs for GitHub Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "build-docs"
  cancel-in-progress: false

jobs:
  build-docs-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: bun install || npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build SPA into /docs (base /Wap/, 404.html, .nojekyll)
        run: npm run build
        env:
          VITE_BASE_PATH: /Wap/
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FIRESTORE_DATABASE_ID: ${{ vars.VITE_FIRESTORE_DATABASE_ID }}

      - name: Commit built /docs to main branch & sync gh-pages branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FULL_REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.ref_name }}
        run: |
          set -e
          touch .nojekyll docs/.nojekyll
          cp -f docs/index.html docs/404.html

          # 1) Push built /docs folder directly to main branch so "Deploy from a branch: main /docs" succeeds!
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f docs .nojekyll
          if ! git diff --cached --quiet; then
            git commit -m "build: publish /docs for GitHub Pages"
            git push "https://x-access-token:${GH_TOKEN}@github.com/${FULL_REPO}.git" "HEAD:${DEFAULT_BRANCH}"
          fi

          # 2) Also push docs/ to gh-pages branch so either branch setting works
          cd docs
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b gh-pages
          git add -A
          git commit -m "build: publish gh-pages"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${FULL_REPO}.git" gh-pages
          cd ..

          # 3) Trigger a fresh GitHub Pages build via API if permitted
          gh api --method POST "repos/${FULL_REPO}/pages/builds" 2>/dev/null || true
